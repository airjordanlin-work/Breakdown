name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    # Single-entry matrix: keeps the check name "test (3.12)" so branch
    # protection doesn't need changing. requirements.txt is a pip freeze
    # lockfile generated on 3.12, so CI must use 3.12.
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run tests
        run: pytest backend/tests/ -v

      - name: Lint (syntax check)
        run: python -m compileall -q backend/app backend/api backend/tests