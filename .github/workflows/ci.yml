name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Match the Python version used locally. requirements.txt is a pinned
      # lockfile generated with pip freeze on 3.12, so CI must use 3.12 too.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run tests
        run: pytest backend/tests/ -v

      - name: Lint (syntax check)
        run: python -m compileall -q backend/app backend/api backend/tests