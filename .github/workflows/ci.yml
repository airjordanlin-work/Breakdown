name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    # Single-entry matrix: keeps the check name "test (3.12)" so branch
    # protection doesn't need changing. requirements.txt is a pip freeze
    # lockfile generated on 3.12, so CI must use 3.12.
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run tests
        run: pytest backend/tests/ -v

      - name: Lint (syntax check)
        run: python -m compileall -q backend/app backend/api backend/tests

      - name: Smoke test the running backend
        run: |
          cd backend && python -m uvicorn api.server:app --port 8000 > ../uvicorn.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health >/dev/null && break; sleep 2; done
          python backend/scripts/smoke_deployed.py http://localhost:8000 --api-prefix ""

  phone-e2e:
    # Phone layout and session flow in an iPhone-sized browser. The session
    # WebSocket is faked in the tests, so no API key or audio device is needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Install frontend and browsers
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit

      - name: Framing logic test
        working-directory: frontend
        run: node scripts/check-framing.mjs

      - name: Phone e2e (Chromium and WebKit with iPhone 14 emulation)
        working-directory: frontend
        env:
          CI: "true"
          PW_WEBKIT: "1"
        run: npx playwright test --trace off

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
